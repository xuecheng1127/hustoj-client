[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hustoj-client"
version = "0.1.0"
description = "Pure-stdlib Python client for HUSTOJ-style online judges: watch assignments, enter private contests, fetch statements and samples."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["hustoj", "online-judge", "oj", "scraper", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/<your-github-username>/hustoj-client"

[tool.setuptools.packages.find]
where = ["."]
include = ["hustoj_client*"]
